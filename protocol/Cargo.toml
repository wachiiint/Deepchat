[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["io-util"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
